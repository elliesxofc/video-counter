<!DOCTYPE html>

<html>
  <head>
    <link href="../../css/stream1.css" rel="stylesheet"/>
    <link href="../../odometer.css" rel="stylesheet"/>
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Ubuntu' rel='stylesheet'>
    <script src="../../odometer.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  </head>

  <body>
    <div class="card1">
     <iconify-icon icon="mdi:eye" style="color: rgb(5, 143, 255); font-size: 45px;"></iconify-icon>
      <span class="odometer count1" id="viewers">0</span>
    </div>
    <div class="card2">
      <iconify-icon icon="mdi:like" style="color: #7f7; font-size: 45px;"></iconify-icon>
      <span class="odometer count2" id="likes">0</span>
    </div>
    <div class="card3">
      <iconify-icon icon="icon-park-solid:people" style="color: rgb(179, 0, 137); font-size: 45px;"></iconify-icon>
      <span class="odometer count3" id="views">0</span>
    </div>
    <div class="card4">
      <h1 class="user-name" id="name" onclick="search()">Loading... please click here to search up any video or livestream.</h1>
    </div>
  </body>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id") || "";

    async function updateStats() {
      if (!id) return;

      try {
        const res = await fetch(`https://mixerno.space/api/youtube-stream-counter/user/${id}`);
        const data = await res.json();

        // Each entry in data.counts looks like { value: 'viewers'|'goal'|'likes'|'dislikes'|'views', count: '...' }
        // Matching on `value` instead of a fixed index so this doesn't break if the API reorders the array.
        const findCount = (key) => Number(data?.counts?.find((c) => c.value === key)?.count ?? 0);

        const viewers = findCount("viewers");
        const likes   = findCount("likes");
        const views   = findCount("views");
        const name    = data?.user?.[0]?.name ?? data?.user?.[0]?.username ?? "";

        document.getElementById("viewers").innerHTML = viewers;
        document.getElementById("likes").innerHTML = likes;
        document.getElementById("views").innerHTML = views;
        if (name) document.getElementById("name").textContent = name;
      } catch (err) {
        console.error("Failed to fetch stream stats:", err);
      }
    }

    if (id) {
      updateStats();
      setInterval(updateStats, 2000);
    }

    function search() {
      const query = window.prompt("Enter stream Name, ID, or URL.");
      if (!query) return;

      fetch(`https://livecounts.xyz/api/youtube-live-video-count/search/${query}`)
        .then((res) => res.json())
        .then((data) => {
          window.location.href = "?id=" + data.results[0].id;
        })
        .catch((err) => console.error("Search failed:", err));
    }
  </script>
</html>
